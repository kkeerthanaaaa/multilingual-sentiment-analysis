# Language Catalog for Multilingual Regional Sentiment Analysis
# Target: 7 Low-Resource Indian Languages
# Documents scripts, ISO codes, dialect regions, linguistic markers, and model coverage realities.

languages:
  tulu:
    iso_639_3: "tcy"
    iso_639_1: null
    primary_name: "Tulu"
    script: "Kannada"
    script_code: "Knda"
    unicode_range: ["0C80", "0CFF"]
    historical_scripts: ["Tigalari"]
    regions: ["Dakshina Kannada", "Udupi", "Kasaragod (Tulu Nadu)"]
    dialects: ["Common Tulu", "Brahmin Tulu", "Jain Tulu", "Mogaveera Tulu"]
    negation_words: ["ಇಜ್ಜಿ", "ಇಜ್ಜ", "ಅತ್ತ", "ಅತ್ತ್", "ಬೊಡ್ಚಿ", "ಬೋಡ್ಚಿ", "ijji", "atta", "bodchi"]
    sentiment_lexicon_examples:
      positive: ["ಎಡ್ಡೆ", "ಲಾಯ್ಕ್", "ಮಸ್ತ್ ಎಡ್ಡೆ", "ಖುಷಿ", "edde", "laik", "mast edde"]
      negative: ["ಹಾಳ್", "ಕಾಟ", "ಬೇಜಾರ್", "ಕೋಪ", "haal", "kaata", "bejaar"]
    slang_expressions: ["ದಾನೆ ಮಾರ್ರೆ", "ಕುಡ್ಲ", "ಬಾವ", "ಮಾರೆರೆ", "ಪೊಂಡೆ"]
    xlm_roberta_coverage:
      status: "Indirect / Subword Tokenization Only"
      notes: "Tulu is not in XLM-R's 100 officially pretrained languages. Kannada-script Tulu text is tokenized using Kannada subwords with potential representation gap."
    indicbert_coverage:
      v1_supported: false
      v2_supported: false
      notes: "Neither IndicBERT v1 (12 languages) nor v2 explicitly included dedicated Tulu pretraining corpora."
    langdetect_coverage:
      supported: false
      notes: "Standard langdetect library cannot identify Tulu. Script detection resolves to Kannada (kn)."
    known_data_resources:
      - name: "SraVaani (RESPIN / IISc)"
        modality: "Audio + Transcript"
        url: "https://sravaani.iisc.ac.in/"
        status: "Restricted research access / API keys required"
      - name: "Tulu Wikipedia / DravidianLangTech"
        modality: "Text"
        status: "Open access (CC-BY-SA)"

  assamese:
    iso_639_3: "asm"
    iso_639_1: "as"
    primary_name: "Assamese"
    script: "Bengali-Assamese"
    script_code: "Beng"
    unicode_range: ["0980", "09FF"]
    distinctive_characters: ["ৰ", "ৱ"]  # U+09F0 (ro), U+09F1 (wo)
    regions: ["Assam", "Arunachal Pradesh"]
    dialects: ["Eastern Assamese (Standard)", "Kamrupi", "Goalpariya"]
    negation_words: ["নহয়", "নাই", "নালাগে", "নকৰোঁ", "নোৱাৰো", "nohoy", "nai", "nalage"]
    sentiment_lexicon_examples:
      positive: ["ভাল", "ধুনীয়া", "উৎকৃষ্ট", "সুন্দৰ", "আনন্দ", "bhal", "dhuniya"]
      negative: ["বেয়া", "অসুবিধা", "দুখ", "ভুল", "beya", "dukh"]
    slang_expressions: ["হেৰৌ", "দেউতা", "মহা", "কি খবৰ", "লেঠা"]
    xlm_roberta_coverage:
      status: "Supported"
      notes: "Included in XLM-RoBERTa 100 language set."
    indicbert_coverage:
      v1_supported: true
      v2_supported: true
      notes: "Full official support in IndicBERT v1 and IndicBERT v2."
    langdetect_coverage:
      supported: false
      notes: "Standard langdetect library often confuses Assamese with Bengali (bn) due to shared script, except when distinctive characters ৰ or ৱ appear."
    known_data_resources:
      - name: "AI4Bharat IndicCorp / IndicNLP"
        modality: "Text"
        status: "Open access"
      - name: "LDC-IL Assamese Monolingual & Speech Corpus"
        modality: "Text + Speech"
        status: "Academic license / Registration required"

  konkani:
    iso_639_3: "kok"
    iso_639_1: null
    primary_name: "Konkani"
    script: "Devanagari"
    script_code: "Deva"
    unicode_range: ["0900", "097F"]
    alternative_scripts: ["Kannada (Knda)", "Latin / Romi (Latn)", "Malayalam (Mlym)"]
    regions: ["Goa", "Coastal Karnataka (Mangalore/Karwar)", "Maharashtra", "Kerala (Kochi)"]
    dialects: ["Goan Konkani", "Mangalorean Konkani", "Bardeskari", "Saxtti"]
    negation_words: ["ना", "न्हय", "नाका", "नुसत", "na", "nhay", "naka"]
    sentiment_lexicon_examples:
      positive: ["बोरें", "सोबीत", "आनंद", "बेस", "borem", "sobit"]
      negative: ["वायट", "बेजार", "दुख्ख", "खारें", "vaitt", "bejar"]
    slang_expressions: ["पाव", "भावा", "बबड्या", "दोस्त", "कसो आसा"]
    xlm_roberta_coverage:
      status: "Partial / Cross-lingual Transfer"
      notes: "Not explicitly modeled in XLM-R pretraining list; relies on Devanagari transfer from Marathi/Hindi."
    indicbert_coverage:
      v1_supported: false
      v2_supported: true
      notes: "Supported in IndicBERT v2 (gom / kok). Not in v1."
    langdetect_coverage:
      supported: false
      notes: "Not supported by standard langdetect; Devanagari text frequently misidentified as Hindi or Marathi."
    known_data_resources:
      - name: "AI4Bharat IndicCorp v2 (gom)"
        modality: "Text"
        status: "Open access"
      - name: "LDC-IL Konkani Corpus"
        modality: "Text + Speech"
        status: "Restricted academic license"

  santali:
    iso_639_3: "sat"
    iso_639_1: null
    primary_name: "Santali"
    script: "Ol Chiki"
    script_code: "Olck"
    unicode_range: ["1C50", "1C7F"]
    alternative_scripts: ["Devanagari", "Bengali", "Latin"]
    regions: ["Jharkhand", "Odisha", "West Bengal", "Assam", "Bihar"]
    dialects: ["Parganas", "Mayurbhanj", "Midnapore"]
    negation_words: ["ᱵᱟᱝ", "ᱵᱟ", "ᱵᱟᱭ", "ᱟᱞᱚ", "bang", "ba", "alo"]
    sentiment_lexicon_examples:
      positive: ["ᱵᱷᱟᱹᱜᱤ", "ᱱᱟᱯᱟᱭ", "ᱨᱟᱹᱥᱠᱟᱹ", "bhagi", "napai", "raska"]
      negative: ["ᱵᱟᱹᱲᱤᱡ", "ᱫᱩᱠᱷ", "ᱵᱟᱹᱲᱤᱪ", "barij", "dukh"]
    slang_expressions: ["ᱦᱮᱸᱫᱟ", "ᱜᱟᱛᱮ", "ᱦᱚᱯᱚᱱ", "ᱡᱚᱦᱟᱨ"]
    xlm_roberta_coverage:
      status: "Unsupported / Byte Fallback"
      notes: "Ol Chiki script characters are not standardly covered in XLM-R vocabulary; fall back to byte-level BPE tokens."
    indicbert_coverage:
      v1_supported: false
      v2_supported: true
      notes: "IndicBERT v2 includes Santali (sat) in Ol Chiki and Latin scripts."
    langdetect_coverage:
      supported: false
      notes: "langdetect has no model for Santali. Ol Chiki Unicode block can be deterministically identified by script."
    known_data_resources:
      - name: "IndicCorp v2 (sat)"
        modality: "Text (Ol Chiki)"
        status: "Open access"
      - name: "LDC-IL Santali Corpus"
        modality: "Text + Speech"
        status: "Restricted academic license"

  bodo:
    iso_639_3: "brx"
    iso_639_1: null
    primary_name: "Bodo"
    script: "Devanagari"
    script_code: "Deva"
    unicode_range: ["0900", "097F"]
    historical_scripts: ["Latin", "Bengali-Assamese"]

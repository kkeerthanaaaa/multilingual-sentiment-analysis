      v2_supported: true
      notes: "Supported in IndicBERT v2 (brx)."
    langdetect_coverage:
      supported: false
      notes: "langdetect does not support Bodo; defaults to Hindi or Nepali on Devanagari input."
    known_data_resources:
      - name: "AI4Bharat IndicCorp v2 (brx)"
        modality: "Text"
        status: "Open access"
      - name: "LDC-IL Bodo Speech and Text"
        modality: "Text + Speech"
        status: "Restricted academic license"

